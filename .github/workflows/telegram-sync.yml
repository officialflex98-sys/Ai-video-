name: Telegram Script Sync

on:
  schedule:
    - cron: "*/5 * * * *"   # checks Telegram every ~5 minutes
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Check Telegram for a new script
        id: sync
        continue-on-error: true
        run: python telegram_script_sync.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit and push updated script.txt
        if: steps.sync.outcome == 'success'
        run: |
          git config user.name "telegram-sync-bot"
          git config user.email "actions@github.com"
          git add script.txt .telegram_offset
          git diff --staged --quiet || git commit -m "Update script.txt via Telegram"
          git push
