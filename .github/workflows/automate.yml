name: Build Video

on:
  push:
    branches: [main]
    paths:
      - "script.txt"
      - "Build_video.py"
      - "generate_voiceover.py"
      - "postprocess_video.py"
      - "fetch_music.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (required by moviepy)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Clean up stale run artifacts
        run: rm -rf voiceover_segments clips scene_renders scene_images final_video.mp4 final_video_youtube.mp4 voiceover.wav music.mp3

      - name: Generate voiceover
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: python generate_voiceover.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Fetch background music
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: python fetch_music.py
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}

      - name: Run video builder
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          command: python Build_video.py

      - name: Post-process video (fades + YouTube re-encode)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: python postprocess_video.py

      - name: Create GitHub Release with video
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="video-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" final_video_youtube.mp4 \
            --title "Generated video - $TAG" \
            --notes "Automatically generated video."
          URL=$(gh release view "$TAG" --json assets -q '.assets[0].url')
          echo "download_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        run: python notify_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOWNLOAD_URL: ${{ steps.release.outputs.download_url }}
